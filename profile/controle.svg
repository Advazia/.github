<svg xmlns="http://www.w3.org/2000/svg" width="880" height="563" viewBox="0 0 880 563" role="img" aria-label="04 · Contrôle">
<rect x="0" y="0" width="880" height="563" fill="#FAFAF9"/>

<line x1="56" y1="74" x2="56" y2="519" stroke="#E5E1D8"/>
<text x="44" y="54.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="start">67</text>
<text x="70" y="60.0" font-family="'IBM Plex Serif',Georgia,'Times New Roman',serif" font-size="24" font-weight="400" fill="#14130F" text-anchor="start">Contrôle</text>
<text x="336" y="64.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#14130F" text-anchor="start">Un système d'intelligence artificielle peut faire des erreurs.</text>
<text x="336" y="85.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#14130F" text-anchor="start">Les éviter suppose d'identifier les étapes sensibles à la</text>
<text x="336" y="107.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#14130F" text-anchor="start">conception, et d'y poser les contrôles.</text>
<text x="318" y="64.0" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">68</text>
<text x="318" y="85.8" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">69</text>
<text x="318" y="107.5" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">70</text>
<line x1="336" y1="145.3" x2="836" y2="145.3" stroke="#E5E1D8"/>
<text x="336" y="159.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#14130F" text-anchor="start">Un humain dans la</text>
<text x="336" y="180.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#14130F" text-anchor="start">boucle</text>
<text x="526" y="159.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">Nous définissons ensemble les moments où</text>
<text x="526" y="180.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">un humain valide. Le dossier lui revient</text>
<text x="526" y="201.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">avec les éléments du choix, et les étapes</text>
<text x="526" y="222.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">concernées sont écrites au périmètre</text>
<text x="526" y="243.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">avant les travaux.</text>
<text x="318" y="159.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">71</text>
<text x="318" y="180.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">72</text>
<text x="318" y="201.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">73</text>
<text x="318" y="222.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">74</text>
<text x="318" y="243.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">75</text>
<line x1="336" y1="280.3" x2="836" y2="280.3" stroke="#E5E1D8"/>
<text x="336" y="294.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#14130F" text-anchor="start">Des réponses</text>
<text x="336" y="315.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#14130F" text-anchor="start">vérifiables</text>
<text x="526" y="294.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">Un modèle interrogé seul invente. Le</text>
<text x="526" y="315.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">système répond à partir de vos documents,</text>
<text x="526" y="336.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">indique sa source, et signale les</text>
<text x="526" y="357.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">questions restées sans réponse.</text>
<text x="318" y="294.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">76</text>
<text x="318" y="315.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">77</text>
<text x="318" y="336.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">78</text>
<text x="318" y="357.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">79</text>
<line x1="336" y1="394.3" x2="836" y2="394.3" stroke="#E5E1D8"/>
<text x="336" y="408.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#14130F" text-anchor="start">Des coûts plafonnés</text>
<text x="526" y="408.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">Chaque installation comprend une</text>
<text x="526" y="429.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">passerelle, et aucun appel à un modèle ne</text>
<text x="526" y="450.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">la contourne. Vous y voyez la dépense cas</text>
<text x="526" y="471.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">d'usage par cas d'usage, et vous y fixez</text>
<text x="526" y="492.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6B665A" text-anchor="start">le plafond.</text>
<text x="318" y="408.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">80</text>
<text x="318" y="429.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">81</text>
<text x="318" y="450.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">82</text>
<text x="318" y="471.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">83</text>
<text x="318" y="492.3" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" font-weight="400" fill="#9A958A" text-anchor="end">84</text>
</svg>
