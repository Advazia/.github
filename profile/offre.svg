<text x="486" y="257.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B665A" text-anchor="start">répétitifs coûtent</text>
