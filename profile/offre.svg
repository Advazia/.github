<svg xmlns="http://www.w3.org/2000/svg" width="880" height="732.25" viewBox="0 0 880 732.25" role="img" aria-label="Offre et prix">
<rect x="0.5" y="0.5" width="879" height="731.25" rx="6" fill="#14130F" stroke="#3A3830"/>
<text x="44" y="56.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#F3EEDF" text-anchor="start" letter-spacing="1.6">06 · Offre et prix</text>
<line x1="44" y1="78" x2="836" y2="78" stroke="#F3EEDF" stroke-width="1" opacity=".55"/>
<text x="44" y="120.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#EDE8DC" text-anchor="start">Chaque étape se décide séparément, à un prix arrêté avant qu'elle commence. Aucune n'est facturée au</text>
<text x="44" y="141.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#EDE8DC" text-anchor="start">temps passé. Elles valent pour les quatre formes d'intervention, même si une intervention ne les appelle</text>
<text x="44" y="162.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#EDE8DC" text-anchor="start">pas toutes.</text>
<text x="214" y="209.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#F3EEDF" text-anchor="start" letter-spacing="1.2">Ce qu'elle produit</text>
<text x="538" y="209.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#F3EEDF" text-anchor="start" letter-spacing="1.2">Ce à quoi nous nous engageons</text>
<line x1="44" y1="221" x2="836" y2="221" stroke="#3A3830"/>
<text x="44" y="247.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#EDE8DC" text-anchor="start">01  Diagnostic</text>
<text x="214" y="247.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">Nous chiffrons ce que vos processus</text>
<text x="214" y="266.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">répétitifs coûtent aujourd'hui, et nous</text>
<text x="214" y="286.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">nommons ceux dont l'automatisation</text>
<text x="214" y="305.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">rapporterait le plus.</text>
<text x="538" y="247.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">Il n'est pas facturé, et vous gardez le</text>
<text x="538" y="266.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">document, que vous alliez plus loin ou</text>
<text x="538" y="286.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">non.</text>
<line x1="44" y1="335" x2="836" y2="335" stroke="#3A3830"/>
<text x="44" y="361.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#EDE8DC" text-anchor="start">02  Mise en production</text>
<text x="214" y="361.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">Nous mettons un cas d'usage en service, à</text>
<text x="214" y="380.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">une date convenue avec vous.</text>
<text x="538" y="361.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">Le prix est arrêté d'avance et n'est</text>
<text x="538" y="380.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">exigible qu'à la mise en service. Si la</text>
<text x="538" y="400.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">date n'est pas tenue, nous ne le facturons</text>
<text x="538" y="419.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">pas.</text>
<line x1="44" y1="449" x2="836" y2="449" stroke="#3A3830"/>
<text x="44" y="475.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#EDE8DC" text-anchor="start">03  Formation</text>
<text x="214" y="475.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">Vos équipes apprennent à conduire le</text>
<text x="214" y="494.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">système, et à traiter les dossiers qu'il</text>
<text x="214" y="514.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">leur renvoie.</text>
<text x="538" y="475.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">Elle est comprise dans le prix de chaque</text>
<text x="538" y="494.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">installation, et nous la donnons aussi</text>
<text x="538" y="514.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">seule.</text>
<line x1="44" y1="543.5" x2="836" y2="543.5" stroke="#3A3830"/>
<text x="44" y="569.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#EDE8DC" text-anchor="start">04  Maintien en service</text>
<text x="214" y="569.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">Nous supervisons le système, nous tenons</text>
<text x="214" y="589.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">les logiciels à jour, et nous faisons</text>
<text x="214" y="608.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#B9B3A4" text-anchor="start">évoluer le périmètre.</text>
<text x="538" y="569.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">Un abonnement mensuel, résiliable à tout</text>
<text x="538" y="589.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#EDE8DC" text-anchor="start">moment.</text>
<line x1="44" y1="638" x2="836" y2="638" stroke="#3A3830"/>
<text x="44" y="668.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EDE8DC" text-anchor="start">Le périmètre et la définition de « en production » sont écrits et signés avant que les travaux commencent.</text>
</svg>
