<text x="123.75" y="84.2" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#EDE8DC" text-anchor="start" letter-spacing="8.32">ADVAZIA</text>
<text x="44" y="179.8" font-family="'IBM Plex Serif',Georgia,'Times New Roman',serif" font-size="34" font-weight="400" fill="#EDE8DC" text-anchor="start">Nous conduisons le passage des entreprises à</text>
<text x="44" y="222.3" font-family="'IBM Plex Serif',Georgia,'Times New Roman',serif" font-size="34" font-weight="400" fill="#EDE8DC" text-anchor="start">l'ère de l'intelligence artificielle.</text>
<text x="44" y="296.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#B9B3A4" text-anchor="start">Nous installons des logiciels d'intelligence artificielle dans les entreprises, et nous les</text>
<text x="44" y="320.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#B9B3A4" text-anchor="start">maintenons en service.</text>
