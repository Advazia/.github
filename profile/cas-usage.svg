<svg xmlns="http://www.w3.org/2000/svg" width="880" height="616.5" viewBox="0 0 880 616.5" role="img" aria-label="Cas d'usage">
<rect x="0.5" y="0.5" width="879" height="615.5" rx="6" fill="#FAFAF9" stroke="#E4E1DB"/>
<text x="44" y="56.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#7A1230" text-anchor="start" letter-spacing="1.6">03 · Cas d'usage</text>
<line x1="44" y1="78" x2="836" y2="78" stroke="#7A1230" stroke-width="1" opacity=".55"/>
<text x="44" y="120.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#14130F" text-anchor="start">Nous proposons quatre formes d'intervention, qui peuvent se cumuler. Le diagnostic établit</text>
<text x="44" y="142.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#14130F" text-anchor="start">lesquelles s'appliquent, et dans quel ordre.</text>
<text x="44" y="201.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#7A1230" text-anchor="start">Le poste de travail augmenté</text>
<text x="44" y="227.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">Nous donnons à vos équipes des outils qu'elles</text>
<text x="44" y="247.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">utilisent au quotidien : un assistant de</text>
<text x="44" y="267.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">conversation, une recherche qui répond à partir de</text>
<text x="44" y="287.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">vos propres documents et indique sa source, et une</text>
<text x="44" y="308.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">assistance directement dans leurs logiciels de</text>
<text x="44" y="328.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">bureautique. Ces outils sont reliés à vos systèmes :</text>
<text x="44" y="348.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">ils trient le courrier à l'arrivée, et créent les</text>
<text x="44" y="368.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">tâches dans l'outil de suivi de vos équipes.</text>
<text x="456" y="201.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#7A1230" text-anchor="start">Le levier manquant</text>
<text x="456" y="227.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">Beaucoup d'entreprises paient déjà des licences</text>
<text x="456" y="247.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">d'assistants d'intelligence artificielle, mais leurs</text>
<text x="456" y="267.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">équipes ne s'en servent que pour rédiger. Nous</text>
<text x="456" y="287.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">reprenons ces abonnements et leur ajoutons ce qui</text>
<text x="456" y="308.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">leur manque : des procédures réutilisables, des</text>
<text x="456" y="328.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">connecteurs vers vos outils internes, et les</text>
<text x="456" y="348.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">liaisons qui font circuler l'information d'un</text>
<text x="456" y="368.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">logiciel à l'autre.</text>
<text x="44" y="425.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#7A1230" text-anchor="start">L'automatisation d'un cas d'usage</text>
<text x="44" y="451.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">Une automatisation peut être entièrement autonome,</text>
<text x="44" y="471.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">ou segmentée par des interventions humaines aux</text>
<text x="44" y="491.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">étapes qui le demandent. Nous commençons par établir</text>
<text x="44" y="511.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">ce que la tâche fait réellement, nous redessinons le</text>
<text x="44" y="532.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">processus lorsqu'il ne mérite pas d'être automatisé</text>
<text x="44" y="552.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">tel quel, puis nous le mettons en service.</text>
<text x="456" y="425.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#7A1230" text-anchor="start">L'accompagnement à la numérisation</text>
<text x="456" y="451.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">Un processus ne peut être automatisé que si les</text>
<text x="456" y="471.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">documents qu'il traite sont lisibles par une</text>
<text x="456" y="491.5" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">machine. Nous reprenons d'abord ce qui ne l'est pas</text>
<text x="456" y="511.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">: dossiers papier, archives scannées sans texte,</text>
<text x="456" y="532.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">tableurs épars.</text>
</svg>
