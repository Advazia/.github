<svg xmlns="http://www.w3.org/2000/svg" width="880" height="407.85" viewBox="0 0 880 407.85" role="img" aria-label="Comment nous travaillons">
<rect x="0.5" y="0.5" width="879" height="406.85" rx="6" fill="#FAFAF9" stroke="#E4E1DB"/>
<text x="44" y="56.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#7A1230" text-anchor="start" letter-spacing="1.6">01 · Comment nous travaillons</text>
<line x1="44" y1="78" x2="836" y2="78" stroke="#7A1230" stroke-width="1" opacity=".55"/>
<text x="44" y="122.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14130F" text-anchor="start">Un ingénieur assigné à</text>
<text x="44" y="142.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14130F" text-anchor="start">votre entreprise</text>
<text x="44" y="181.6" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">La même personne conduit le</text>
<text x="44" y="201.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">diagnostic, la mise en</text>
<text x="44" y="222.1" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">production, la formation et le</text>
<text x="44" y="242.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">maintien en service.</text>
<text x="317.33333333333337" y="122.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14130F" text-anchor="start">Ce que nous installons vous</text>
<text x="317.33333333333337" y="142.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14130F" text-anchor="start">appartient</text>
<text x="317.33333333333337" y="181.6" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">Les logiciels, les développements</text>
<text x="317.33333333333337" y="201.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">qui les intègrent à vos systèmes</text>
<text x="317.33333333333337" y="222.1" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">et la documentation ne sont pas</text>
<text x="317.33333333333337" y="242.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">propriétaires : ils peuvent être</text>
<text x="317.33333333333337" y="262.6" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">repris par vos équipes, ou par</text>
<text x="317.33333333333337" y="282.9" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">celles d'un autre prestataire.</text>
<text x="590.6666666666667" y="122.0" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14130F" text-anchor="start">Un système fiable et</text>
<text x="590.6666666666667" y="142.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14130F" text-anchor="start">sécurisé par conception</text>
<text x="590.6666666666667" y="181.6" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">Un humain peut être inclus dans</text>
<text x="590.6666666666667" y="201.8" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">le processus automatisé pour</text>
<text x="590.6666666666667" y="222.1" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">valider les étapes sensibles. Les</text>
<text x="590.6666666666667" y="242.3" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">réponses viennent de sources</text>
<text x="590.6666666666667" y="262.6" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">vérifiables. La dépense est</text>
<text x="590.6666666666667" y="282.9" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">plafonnée au montant que vous</text>
<text x="590.6666666666667" y="303.1" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">fixez, et les accès du système à</text>
<text x="590.6666666666667" y="323.4" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">vos outils sont définis un par</text>
<text x="590.6666666666667" y="343.6" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6B675F" text-anchor="start">un.</text>
</svg>
